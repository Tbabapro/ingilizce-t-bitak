<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-H'den İngilizce | İngilizceni Geliştir</title>
<style>
:root{--bg:#0b1020;--panel:#141c31;--panel2:#1b2742;--line:#2c3a5b;--text:#f4f7ff;--muted:#aab7d3;--blue:#6ea8fe;--cyan:#5ce1e6;--yellow:#ffd166;--pink:#ff7eb6;--green:#66e3a4;--red:#ff7885}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#172647 0,#0b1020 58%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1220px;margin:auto;padding:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0 22px}
.brand{display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:900;letter-spacing:.2px}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#0b1020;font-size:23px;box-shadow:0 8px 30px #5ce1e633}
.stats{display:flex;gap:9px;flex-wrap:wrap}
.stat{background:#141c31;border:1px solid var(--line);padding:9px 13px;border-radius:13px;color:var(--muted);font-size:.9rem}
.stat strong{color:white}
.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:18px;align-items:stretch;margin-bottom:18px}
.hero-main,.hero-side,.panel{background:linear-gradient(145deg,#182542,#11192c);border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:0 16px 45px #0002}
.eyebrow{color:var(--cyan);font-weight:800;text-transform:uppercase;letter-spacing:1.6px;font-size:.75rem}
.hero h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.03;margin:12px 0}
.hero p{color:var(--muted);line-height:1.7;max-width:700px}
.hero-side{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#22395c,#182542)}
.hero-art{font-size:4.4rem;letter-spacing:4px;text-align:center;margin:6px 0}
.progressbar{height:9px;border-radius:20px;background:#0c1323;overflow:hidden;margin:12px 0}
.progressbar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0;transition:width .3s}
.btn{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#081020;padding:11px 16px;border-radius:12px;font-weight:850;box-shadow:0 6px 18px #5ce1e61c}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.secondary{background:#243452;color:var(--text);border:1px solid #3a4b70;box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:8px 11px;font-size:.86rem}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.nav button{background:#141c31;border:1px solid var(--line);color:var(--muted);padding:11px 14px;border-radius:12px;font-weight:800}
.nav button.active,.nav button:hover{background:#263b60;color:white;border-color:#597bb7}
.section{display:none}
.section.active{display:block}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:22px 0 16px}
.section-head h2{margin:4px 0;font-size:1.8rem}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:linear-gradient(150deg,#17223a,#11192b);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h3{margin:8px 0}
.card p{color:var(--muted);line-height:1.6}
.card-icon{font-size:2rem}
.pill{display:inline-flex;align-items:center;gap:5px;background:#263654;color:#cbd9f3;border:1px solid #344768;border-radius:100px;padding:5px 9px;font-size:.78rem;font-weight:750}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.field{background:#0e1628;border:1px solid var(--line);color:white;padding:11px 12px;border-radius:11px;min-width:0}
.field option{background:#101a2d}
.grade-btn{min-height:130px;text-align:left;transition:.2s}
.grade-btn:hover{transform:translateY(-3px);border-color:var(--cyan)}
.grade-btn strong{font-size:1.3rem;display:block;margin:8px 0}
.grade-btn .emoji{font-size:2rem}
.unit-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit-btn{text-align:left;display:flex;gap:12px;align-items:center;background:#10192b;color:white;border:1px solid var(--line);padding:14px;border-radius:15px}
.unit-btn:hover{border-color:var(--cyan);background:#1a2944}
.unit-num{display:grid;place-items:center;min-width:40px;height:40px;border-radius:12px;background:#273d61;color:var(--cyan);font-weight:900}
.unit-btn small{display:block;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.tab{background:#111a2d;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:750}
.tab.active{background:#294368;color:white;border-color:#6288c9}
.lesson h3{margin-top:22px}
.lesson p,.lesson li{line-height:1.75;color:#d7e0f4}
.lesson .rule{padding:14px 16px;background:#0e1729;border:1px solid #314464;border-left:4px solid var(--cyan);border-radius:12px;margin:12px 0;line-height:1.7}
.example{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.example div{background:#0e1729;border:1px solid var(--line);padding:12px;border-radius:12px}
.example strong{display:block;margin-bottom:4px}
.word-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.word{padding:12px;background:#0e1729;border:1px solid var(--line);border-radius:13px}
.word strong{display:block;font-size:1.02rem}
.word .tr{color:var(--cyan);margin-top:4px}
.word .ex{color:var(--muted);font-size:.83rem;margin-top:7px;line-height:1.45}
.word button{float:right;background:transparent;color:var(--yellow);padding:0 0 4px 8px}
.question{background:#10192b;border:1px solid var(--line);border-radius:17px;padding:18px;margin:12px 0}
.question h3{margin:0 0 14px;font-size:1.08rem}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answer{padding:12px;border:1px solid #354665;background:#182541;color:white;border-radius:11px;text-align:left}
.answer:hover{border-color:var(--cyan)}
.answer.correct{background:#164b3b;border-color:var(--green)}
.answer.wrong{background:#572b3a;border-color:var(--red)}
.feedback{margin-top:10px;color:var(--muted);line-height:1.5}
.result{text-align:center;padding:25px}
.result .big{font-size:3rem}
.game-card{min-height:215px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
.game-card .game-icon{font-size:2.7rem}
.game-card h3{margin:12px 0 5px}
.game-card p{margin:0 0 18px}
.badge{font-size:.74rem;color:var(--yellow);font-weight:800}
.game-arena{background:#0e1729;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:15px}
.game-big{font-size:clamp(1.8rem,5vw,3rem);font-weight:900;text-align:center;padding:22px 0}
.game-progress{height:8px;background:#26334d;border-radius:20px;overflow:hidden}
.game-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));width:100%}
.lgs-note{border:1px solid #795c36;background:#30271b;padding:13px;border-radius:12px;color:#f6dba6;line-height:1.6}
.footer{color:#7786a5;text-align:center;padding:35px 10px 20px;font-size:.85rem}
.hide{display:none!important}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eff7ff;color:#0b1020;font-weight:800;padding:12px 17px;border-radius:12px;box-shadow:0 8px 40px #0006;z-index:99;max-width:90%;text-align:center}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.word-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{padding:12px}.hero-main,.hero-side,.panel{padding:17px}.grid,.grid.two,.unit-list,.word-grid{grid-template-columns:1fr}.example{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.stats{width:100%}.stat{flex:1;text-align:center}.nav button{flex:1}.section-head h2{font-size:1.5rem}}
.logo.logo6h{width:52px;height:46px;border-radius:13px;background:linear-gradient(135deg,#61e3db,#70a5ff 55%,#ad91ff);color:#0b1020;font-size:19px;font-weight:1000;letter-spacing:-1px;border:2px solid #d8faff;box-shadow:0 0 18px #61e3db55;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="brand"><div class="logo logo6h">6-H</div><div>6-H’DEN İNGİLİZCE <div class="muted" style="font-size:.72rem;font-weight:600">ÖĞREN • PRATİK YAP • GELİŞ</div></div></div>
  <div class="stats"><div class="stat">⚡ XP <strong id="xp">0</strong></div><div class="stat">🏅 Seviye <strong id="level">1</strong></div><div class="stat">🔥 Seri <strong id="streak">0</strong></div></div>
</header>
