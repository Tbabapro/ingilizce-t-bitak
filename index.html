      background: rgba(30, 27, 75, 0.85);

            { en: "Occupation", tr: "Meslek", type: "Noun", sentence: "Teaching is a noble occupation.", sentenceTr: "Öğretmenlik yüce bir meslektir." },
            { en: "Environment", tr: "Çevre", type: "Noun", sentence: "Protect the environment.", sentenceTr: "Çevreyi koruyun." }
          ],

          unitNum: i + 1,

          desc: `7. Sınıf ${i+1}. Ünite: ${titles[i]} konuları ve detaylı dil yapıları.`,
          words: [
            { en: "Personality", tr: "Kişilik", type: "Noun", sentence: "She has a kind personality.", sentenceTr: "O nazik bir kişiliğe sahip." },
            { en: "Biography", tr: "Biyografi", type: "Noun", sentence: "I read Atatürk's biography.", sentenceTr: "Atatürk'ün biyografisini okudum." },

          ],
          grammar: {
            title: `${titles[i]} Gramer Rehberi`,
            desc: "Geçmiş Zaman (Simple Past Tense) ve 'Should/Shouldn't' tavsiye kalıpları.",

      }),
      8: Array.from({ length: 10 }, (_, i) => {
        const titles = [
          "Friendship", "Teen Life", "In the Kitchen", "On the Phone", "The Internet",
          "Adventures", "Tourism", "Chores", "Science", "Natural Forces"
        ];
        return {
          id: `8-${i+1}`,
          grade: 8,
          unitNum: i + 1,
          title: titles[i],
          desc: `8. Sınıf (LGS) ${i+1}. Ünite: ${titles[i]} sınav odaklı soru tipleri ve diyaloglar.`,
          words: [
            { en: "Mate / Buddy", tr: "Yakın Arkadaş", type: "Noun", sentence: "He is my best buddy.", sentenceTr: "O benim en yakın arkadaşım." },
            { en: "Ingredient", tr: "Malzeme / İçerik", type: "Noun", sentence: "Flour is a cake ingredient.", sentenceTr: "Un bir kek malzemesidir." },
            { en: "Communication", tr: "İletişim", type: "Noun", sentence: "Phones ease communication.", sentenceTr: "Telefonlar iletişimi kolaylaştırır." },
            { en: "Adventure", tr: "Macera", type: "Noun", sentence: "Rafting is an adventure.", sentenceTr: "Rafting bir maceradır." },

          ],
          grammar: {
            title: `${titles[i]} LGS Gramer Püf Noktaları`,
            desc: "LGS İngilizce sorularında çıkan davet, teklif ve bağlaç kalıpları.",

            examples: [
              { en: "Would you like to join our party?", tr: "Partimize katılmak ister misin?" },
              { en: "I love science because it is intriguing.", tr: "Bilimi seviyorum çünkü ilgi çekici." }
            ]
          }
        };
      })
    };

    // ==========================================
    // 2. USER PROGRESS & LOCALSTORAGE MANAGEMENT
    // ==========================================
    let userProgress = {
      xp: 0,
      level: 1,
      learnedWords: [],
      completedUnits: [],
      testScores: {},
      gameHighScores: { game1: 0, game2: 0, game3: 0 },
      badges: []
    };

    function loadProgress() {
      const saved = localStorage.getItem("6h_english_user_data");
      if (saved) {
        try {
          userProgress = { ...userProgress, ...JSON.parse(saved) };
        } catch (e) {
          console.error("Progress parsing error:", e);
        }
      }
      updateUIStats();
    }

    function saveProgress() {
      localStorage.setItem("6h_english_user_data", JSON.stringify(userProgress));
      updateUIStats();
    }

    function addXP(amount, reason = "") {
      userProgress.xp += amount;
      const newLevel = Math.floor(userProgress.xp / 100) + 1;
      if (newLevel > userProgress.level) {
        userProgress.level = newLevel;
        showToast(`TEBRİKLER! Seviye ${newLevel} oldun! 🎉`, "success");
      } else if (reason) {
        showToast(`+${amount} XP Kazanıldı! (${reason})`, "success");
      }
      saveProgress();
    }

    function updateUIStats() {
      const xpEl = document.getElementById("nav-xp");
      if (xpEl) xpEl.innerText = `${userProgress.xp} XP (Svy ${userProgress.level})`;
    }

    // ==========================================
    // 3. VOICE SPEECH SYSTEM (WEB SPEECH API)
    // ==========================================
    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        showToast("Tarayıcınız seslendirmeyi desteklemiyor.", "error");
        return;
      }
      window.speechSynthesis.cancel(); // Stop current speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9; // Slightly slower for better learning
      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // 4. ROUTING & UI NAVIGATION
    // ==========================================
    let currentRoute = "home";

    function navigateTo(route, param = null) {
      currentRoute = route;
      const main = document.getElementById("main-content");
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Close mobile menu
      document.getElementById("mobile-menu").classList.add("hidden");

      switch(route) {
        case 'home':
          renderHome(main);
          break;
        case 'classes':
          renderClasses(main);
          break;
        case 'unit-detail':
          renderUnitDetail(main, param);
          break;
        case 'words':
          renderWordsPage(main);
          break;
        case 'tests':
          renderTestsPage(main, param);
          break;
        case 'games':
          renderGamesPage(main);
          break;
        case 'lgs':
          renderLGSPage(main);
          break;
        case 'profile':
          renderProfilePage(main);
          break;
        default:
          renderHome(main);
      }
    }

    // ==========================================
    // 5. RENDER FUNCTIONS FOR PAGES
    // ==========================================

    // --- HOME PAGE ---
    function renderHome(container) {
      container.innerHTML = `
        <!-- HERO SECTION -->

            <span class="inline-block px-4 py-1.5 rounded-full bg-white/20 backdrop-blur-md text-xs font-bold uppercase tracking-wider mb-4 border border-white/30">
              ⚡ Okul Müfredatına Tam Uyumlu
            </span>
            <h1 class="text-3xl sm:text-5xl font-black mb-4 leading-tight">
              İngilizceni Geliştir, Seviyeni Yükselt!
            </h1>
            <p class="text-indigo-100 text-base sm:text-lg mb-8 leading-relaxed">
              5, 6, 7 ve 8. Sınıf kelimelerini öğren, eğlenceli testleri çöz, mini oyunlar oyna ve XP toplayarak şampiyon ol!

    function startGeneratedTest() {
      const grade = document.getElementById("test-select-grade").value;
      const units = COURSE_DATA[grade] || [];
      
      // Generate 5 questions from words
      let questions = [];
      units.forEach(u => {
        u.words.forEach(w => {
          // Generate 3 wrong options
          const wrongAnswers = ["Elma", "Koşmak", "Kitap", "Araba", "Mavi", "Okul", "Güneş"]
            .filter(x => x !== w.tr)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3);
          
          const rawOptions = [w.tr, ...wrongAnswers];
          // Shuffle options
          const shuffledOptions = rawOptions.sort(() => 0.5 - Math.random());
          const correctIdx = shuffledOptions.indexOf(w.tr);

          questions.push({
            question: `"${w.en}" kelimesinin Türkçe anlamı nedir?`,
            options: shuffledOptions,
            correct: correctIdx,
            explain: `"${w.en}" kelimesinin doğru karşılığı "${w.tr}" ifadesidir.`
          });
        });
      });

      questions = questions.sort(() => 0.5 - Math.random()).slice(0, 10);
      runQuestionLoop(questions);
    }

    function startUnitSpecificTest(unitId) {
      let unit = null;
      Object.values(COURSE_DATA).forEach(list => {
        const u = list.find(x => x.id === unitId);
        if(u) unit = u;
      });
      if(!unit) return;

      let questions = unit.words.map(w => {
        const wrong = ["Masa", "Kalem", "Büyük", "Hızlı", "Mutlu", "Yavaş"]
          .filter(x => x !== w.tr)
          .sort(() => 0.5 - Math.random())
          .slice(0, 3);
        const raw = [w.tr, ...wrong];
        const shuffled = raw.sort(() => 0.5 - Math.random());
        return {
          question: `"${w.en}" ifadesinin anlamı aşağıdakilerden hangisidir?`,
          options: shuffled,
          correct: shuffled.indexOf(w.tr),
          explain: `Doğru cevap: ${w.tr}`
        };
      });

      runQuestionLoop(questions);
    }

    function runQuestionLoop(questions) {
      currentTestQuestions = questions;
      currentQuestionIndex = 0;
      testUserAnswers = [];
      renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
      const container = document.getElementById("test-runner-area");
      const q = currentTestQuestions[currentQuestionIndex];
      const total = currentTestQuestions.length;

      if (currentQuestionIndex >= total) {
        finishTest();
        return;
      }

      container.innerHTML = `
        <div class="glass-card rounded-3xl p-8 border border-slate-200 dark:border-slate-800 max-w-2xl mx-auto shadow-xl">
          <!-- PROGRESS BAR -->
          <div class="flex items-center justify-between text-xs font-bold text-slate-400 mb-4">
            <span>Soru ${currentQuestionIndex + 1} / ${total}</span>
            <span>%${Math.round(((currentQuestionIndex) / total) * 100)} Tamamlandı</span>
          </div>
          <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2 mb-8">
            <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${((currentQuestionIndex) / total) * 100}%"></div>
          </div>

          <h3 class="text-xl font-bold mb-6 text-slate-800 dark:text-white">${q.question}</h3>

          <div class="space-y-3 mb-8">
            ${q.options.map((opt, idx) => `
              <button onclick="selectAnswer(${idx})" class="option-btn w-full text-left p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-semibold text-sm hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 transition flex items-center justify-between">
                <span><b class="mr-2">${['A', 'B', 'C', 'D'][idx]})</b> ${opt}</span>
                <i class="fa-regular fa-circle text-slate-300"></i>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function selectAnswer(selectedIdx) {
      const q = currentTestQuestions[currentQuestionIndex];
      const isCorrect = selectedIdx === q.correct;
      testUserAnswers.push({ selected: selectedIdx, isCorrect });

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) {
          btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800', 'dark:bg-emerald-950', 'dark:text-emerald-300');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('bg-pink-100', 'border-pink-500', 'text-pink-800', 'dark:bg-pink-950', 'dark:text-pink-300');
        }
      });

      setTimeout(() => {
        currentQuestionIndex++;
        renderCurrentQuestion();
      }, 1200);
    }

    function finishTest() {
      const container = document.getElementById("test-runner-area");
      const correctCount = testUserAnswers.filter(a => a.isCorrect).length;
      const total = currentTestQuestions.length;
      const score = Math.round((correctCount / total) * 100);
      const earnedXP = correctCount * 10;

      addXP(earnedXP, "Test Başarısı");

      container.innerHTML = `
        <div class="glass-card rounded-3xl p-8 border border-slate-200 dark:border-slate-800 max-w-2xl mx-auto text-center shadow-xl">
          <div class="w-20 h-20 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-500 flex items-center justify-center text-4xl mx-auto mb-4 font-bold shadow-inner">
            🏆
          </div>
          <h2 class="text-3xl font-black mb-2">Test Tamamlandı!</h2>
          <p class="text-slate-500 mb-6">Tebrikler, test sonuçların hazır.</p>

          <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 font-bold uppercase">Doğru</div>
              <div class="text-2xl font-black text-emerald-500">${correctCount}</div>
            </div>
            <div class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 font-bold uppercase">Başarı</div>
              <div class="text-2xl font-black text-indigo-500">%${score}</div>
            </div>
            <div class="bg-slate-100 dark:bg-slate-900 p-4 rounded-2xl">
              <div class="text-xs text-slate-400 font-bold uppercase">Kazanılan XP</div>
              <div class="text-2xl font-black text-amber-500">+${earnedXP}</div>
            </div>
          </div>

          <button onclick="navigateTo('tests')" class="bg-indigo-600 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg hover:bg-indigo-500 transition">
            Başka Test Çöz
          </button>
        </div>
      `;
    }

    // ==========================================
    // 7. GAME CENTER & FIXED GAME 3
    // ==========================================
    function renderGamesPage(container) {
      container.innerHTML = `
        <div class="mb-8">
          <h1 class="text-3xl font-bold mb-2">Oyun Merkezi</h1>
          <p class="text-slate-500 dark:text-slate-400">Eğlenirken kelime dağarcığını geliştir!</p>
        </div>

        <div id="game-canvas-area">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
            
            <div onclick="startMatchGame()" class="glass-card p-6 rounded-3xl text-center cursor-pointer hover:shadow-xl transition border border-slate-200 dark:border-slate-800">
              <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-500 flex items-center justify-center text-3xl mx-auto mb-4">🧩</div>
              <h3 class="text-xl font-bold mb-2">1. Kelime Eşleştirme</h3>
              <p class="text-xs text-slate-500 mb-4">İngilizce ve Türkçe kelime kartlarını eşleştir.</p>
              <span class="bg-amber-500 text-white text-xs px-4 py-2 rounded-xl font-bold inline-block">Oyna</span>
            </div>

            <div onclick="startScrambleGame()" class="glass-card p-6 rounded-3xl text-center cursor-pointer hover:shadow-xl transition border border-slate-200 dark:border-slate-800">
              <div class="w-16 h-16 rounded-2xl bg-purple-100 text-purple-500 flex items-center justify-center text-3xl mx-auto mb-4">🔤</div>
              <h3 class="text-xl font-bold mb-2">2. Harf Karıştırma</h3>
              <p class="text-xs text-slate-500 mb-4">Karışık verilen harflerden doğru kelimeyi yaz.</p>
              <span class="bg-purple-500 text-white text-xs px-4 py-2 rounded-xl font-bold inline-block">Oyna</span>
            </div>

            <div onclick="startTimeRaceGame()" class="glass-card p-6 rounded-3xl text-center cursor-pointer hover:shadow-xl transition border border-slate-200 dark:border-slate-800">
              <div class="w-16 h-16 rounded-2xl bg-pink-100 text-pink-500 flex items-center justify-center text-3xl mx-auto mb-4">⚡</div>
              <h3 class="text-xl font-bold mb-2">3. Süreye Karşı Yarış</h3>
              <p class="text-xs text-slate-500 mb-4">30 saniye içinde en çok doğru cevabı ver!</p>
              <span class="bg-pink-500 text-white text-xs px-4 py-2 rounded-xl font-bold inline-block">Oyna</span>
            </div>

          </div>
        </div>
      `;
    }

    // GAME 1: MATCHING GAME
    function startMatchGame() {
      const area = document.getElementById("game-canvas-area");
      const pairs = [
        { en: "Apple", tr: "Elma" },
        { en: "School", tr: "Okul" },
        { en: "Book", tr: "Kitap" },
        { en: "Friend", tr: "Arkadaş" }
      ];

      let cards = [];
      pairs.forEach(p => {
        cards.push({ text: p.en, match: p.tr, type: 'en' });
        cards.push({ text: p.tr, match: p.en, type: 'tr' });
      });
      cards.sort(() => 0.5 - Math.random());

      area.innerHTML = `
        <div class="glass-card p-8 rounded-3xl max-w-2xl mx-auto text-center">
          <h2 class="text-2xl font-bold mb-6">Kelime Eşleştirme Oyunu</h2>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6" id="match-grid">
            ${cards.map((c, i) => `
              <button onclick="handleMatchSelect(this, '${c.text}', '${c.match}')" class="match-btn h-24 rounded-2xl bg-indigo-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-bold text-sm hover:border-indigo-500 transition">
                ${c.text}
              </button>
            `).join('')}
          </div>
          <button onclick="renderGamesPage(document.getElementById('main-content'))" class="text-xs text-slate-400 font-bold">Çıkış Yap</button>
        </div>
      `;
    }

    let selectedMatchCard = null;
    function handleMatchSelect(btn, text, match) {
      if (btn.disabled) return;

      if (!selectedMatchCard) {
        selectedMatchCard = { btn, text, match };
        btn.classList.add('border-amber-500', 'bg-amber-50');
      } else {
        if (selectedMatchCard.btn === btn) return;

        if (selectedMatchCard.match === text) {
          // CORRECT MATCH
          btn.classList.add('bg-emerald-500', 'text-white');
          selectedMatchCard.btn.classList.add('bg-emerald-500', 'text-white');
          btn.disabled = true;
          selectedMatchCard.btn.disabled = true;
          addXP(15, "Doğru Eşleştirme");
        } else {
          // WRONG MATCH
          selectedMatchCard.btn.classList.remove('border-amber-500', 'bg-amber-50');
        }
        selectedMatchCard = null;
      }
    }

    // GAME 2: WORD SCRAMBLE
    function startScrambleGame() {
      const area = document.getElementById("game-canvas-area");
      const word = { en: "TEACHER", tr: "Öğretmen" };
      const scrambled = word.en.split('').sort(() => 0.5 - Math.random()).join(' ');

      area.innerHTML = `
        <div class="glass-card p-8 rounded-3xl max-w-xl mx-auto text-center">
          <h2 class="text-2xl font-bold mb-2">Harf Karıştırma</h2>
          <p class="text-slate-400 text-sm mb-6">İpucu: ${word.tr}</p>
          <div class="text-3xl font-black text-purple-500 tracking-widest mb-6">${scrambled}</div>
          <input type="text" id="scramble-input" placeholder="Cevabı buraya yaz..." class="w-full text-center py-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 font-bold mb-4 uppercase">
          <button onclick="checkScramble('${word.en}')" class="w-full bg-purple-600 text-white py-3 rounded-2xl font-bold">Kontrol Et</button>
        </div>
      `;
    }

    function checkScramble(correct) {
      const val = document.getElementById("scramble-input").value.trim().toUpperCase();
      if (val === correct) {
        addXP(20, "Harf Karıştırma Başarısı");
        showToast("Tebrikler! Doğru Kelime!", "success");
        renderGamesPage(document.getElementById('main-content'));
      } else {
        showToast("Yanlış cevap, tekrar dene!", "error");
      }
    }

    // GAME 3: TIME RACE (FIXED TIMER & FLOW)
    let timeRaceTimer = null;
    let timeRaceScore = 0;
    let timeRaceTimeLeft = 30;
    let timeRaceCurrentQ = null;

    function startTimeRaceGame() {
      timeRaceScore = 0;
      timeRaceTimeLeft = 30;
      const area = document.getElementById("game-canvas-area");

      area.innerHTML = `
        <div class="glass-card p-8 rounded-3xl max-w-xl mx-auto text-center">
          <div class="flex items-center justify-between mb-6">
            <span class="text-sm font-bold text-pink-500">Süre: <b id="timer-val">30</b>s</span>
            <span class="text-sm font-bold text-indigo-500">Skor: <b id="score-val">0</b></span>
          </div>

          <div id="race-question-box">
            <!-- Dynamically populated question -->
          </div>
        </div>
      `;

      nextTimeRaceQuestion();

      clearInterval(timeRaceTimer);
      timeRaceTimer = setInterval(() => {
        timeRaceTimeLeft--;
        const timerEl = document.getElementById("timer-val");
        if (timerEl) timerEl.innerText = timeRaceTimeLeft;

        if (timeRaceTimeLeft <= 0) {
          clearInterval(timeRaceTimer);
          finishTimeRaceGame();
        }
      }, 1000);
    }

    function nextTimeRaceQuestion() {
      const box = document.getElementById("race-question-box");
      if (!box) return;

      const sampleWords = [
        { en: "Sun", tr: "Güneş" },
        { en: "Water", tr: "Su" },
        { en: "Computer", tr: "Bilgisayar" },
        { en: "Pencil", tr: "Kalem" },
        { en: "Car", tr: "Araba" }
      ];
      timeRaceCurrentQ = sampleWords[Math.floor(Math.random() * sampleWords.length)];

      const wrong = ["Ağaç", "Telefon", "Köpek", "Ev"].filter(x => x !== timeRaceCurrentQ.tr).slice(0, 1)[0];
      const opts = [timeRaceCurrentQ.tr, wrong].sort(() => 0.5 - Math.random());

      box.innerHTML = `
        <h3 class="text-2xl font-black mb-6">"${timeRaceCurrentQ.en}" ne demek?</h3>
        <div class="grid grid-cols-2 gap-4">
          ${opts.map(o => `
            <button onclick="handleRaceAnswer('${o}', '${timeRaceCurrentQ.tr}')" class="p-4 rounded-2xl bg-indigo-50 dark:bg-slate-900 font-bold border border-slate-200 hover:bg-indigo-600 hover:text-white transition">
              ${o}
            </button>
          `).join('')}
        </div>
      `;
    }

    function handleRaceAnswer(selected, correct) {
      if (selected === correct) {
        timeRaceScore += 10;
        const scoreEl = document.getElementById("score-val");
        if (scoreEl) scoreEl.innerText = timeRaceScore;
      }
      nextTimeRaceQuestion();
    }

    function finishTimeRaceGame() {
      addXP(timeRaceScore, "Süreye Karşı Yarış");
      const area = document.getElementById("game-canvas-area");
      area.innerHTML = `
        <div class="glass-card p-8 rounded-3xl max-w-xl mx-auto text-center">
          <h2 class="text-3xl font-black mb-2">Süre Bitti! ⏰</h2>
          <p class="text-slate-400 mb-6">Toplam kazandığın skor: <b class="text-amber-500">${timeRaceScore} Puan</b></p>
          <button onclick="renderGamesPage(document.getElementById('main-content'))" class="bg-indigo-600 text-white font-bold px-8 py-3 rounded-2xl">
            Oyunlara Dön
          </button>
        </div>
      `;
    }

    // --- LGS SPECIAL PAGE ---
    function renderLGSPage(container) {
      container.innerHTML = `
        <div class="mb-8">
          <h1 class="text-3xl font-bold mb-2">8. Sınıf LGS Özel Alanı</h1>
          <p class="text-slate-500 dark:text-slate-400">LGS İngilizce sınav kalıpları, diyaloglar ve soru tipleri.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="glass-card p-6 rounded-3xl border border-slate-200 dark:border-slate-800">
            <h3 class="text-xl font-bold mb-4 text-cyan-500">💬 Sık Çıkan Diyalog Kalıpları</h3>
            <ul class="space-y-3 text-sm">
              <li class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl"><b>"Would you like to...?"</b> &rarr; İster misin? (Teklif)</li>
              <li class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl"><b>"I'm sorry, but I can't."</b> &rarr; Üzgünüm ama yapamam. (Reddetme)</li>
              <li class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl"><b>"That sounds awesome!"</b> &rarr; Kulağa harika geliyor! (Kabul)</li>
            </ul>
          </div>

          <div class="glass-card p-6 rounded-3xl border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
            <div>
              <h3 class="text-xl font-bold mb-2 text-indigo-500">🎯 LGS Deneme Testi</h3>
              <p class="text-xs text-slate-400 mb-6">LGS tarzı çeldiricili sorularla sınav provası yap.</p>
            </div>
            <button onclick="startGeneratedTest()" class="w-full bg-cyan-600 text-white font-bold py-3.5 rounded-2xl shadow-lg">
              LGS Denemesini Başlat
            </button>
          </div>
        </div>
      `;
    }

    // --- PROFILE / PROGRESS PAGE ---
    function renderProfilePage(container) {
      container.innerHTML = `
        <div class="mb-8">
          <h1 class="text-3xl font-bold mb-2">İlerleme Profilim</h1>
          <p class="text-slate-500 dark:text-slate-400">Başarı istatistiklerin ve rozetlerin burada saklanır.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
          <div class="glass-card p-6 rounded-3xl text-center border border-slate-200 dark:border-slate-800">
            <div class="text-xs text-slate-400 font-bold uppercase mb-1">Toplam XP</div>
            <div class="text-4xl font-black text-amber-500">${userProgress.xp}</div>
          </div>
          <div class="glass-card p-6 rounded-3xl text-center border border-slate-200 dark:border-slate-800">
            <div class="text-xs text-slate-400 font-bold uppercase mb-1">Mevcut Seviye</div>
            <div class="text-4xl font-black text-indigo-500">Seviye ${userProgress.level}</div>
          </div>
          <div class="glass-card p-6 rounded-3xl text-center border border-slate-200 dark:border-slate-800">
            <div class="text-xs text-slate-400 font-bold uppercase mb-1">Öğrenilen Kelimeler</div>
            <div class="text-4xl font-black text-pink-500">${userProgress.learnedWords.length}</div>
          </div>
        </div>

        <div class="glass-card p-8 rounded-3xl border border-slate-200 dark:border-slate-800">
          <h3 class="text-xl font-bold mb-4">Tamamlanan Üniteler</h3>
          <div class="flex flex-wrap gap-2">
            ${userProgress.completedUnits.length > 0 
              ? userProgress.completedUnits.map(id => `<span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">Ünite ${id}</span>`).join('')
              : '<p class="text-slate-400 text-sm">Henüz tamamlanan ünite yok.</p>'}
          </div>
        </div>
      `;
    }

    // ==========================================
    // 8. UTILITIES & INITIALIZATION
    // ==========================================
    function showToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      const msgEl = document.getElementById("toast-msg");
      if (!toast || !msgEl) return;

      msgEl.innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");

      setTimeout(() => {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2500);
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function toggleMobileMenu() {
      document.getElementById("mobile-menu").classList.toggle("hidden");
    }

    // ON LOAD INIT
    window.addEventListener("DOMContentLoaded", () => {
      loadProgress();
      navigateTo('home');
    });
  </script>
</body>
</html>
